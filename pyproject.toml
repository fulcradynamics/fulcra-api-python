[project]
name = "fulcra-api"
version = "0.1.56"
description = "Python client library for Context by Fulcra"
authors = [{ name = "Brandon Creighton", email = "brandon@fulcradynamics.com" }]
requires-python = ">= 3.11"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "click>=8.2.1",
    "dateparser>=1.4.0",
    "puremagic>=1.30",
    "jsonschema>=4.0.0",
    "click-option-group>=0.5.9",
]
packages = [{ include = "fulcra_api" }]

[project.optional-dependencies]
# Needed by the methods that return pandas DataFrames (metric_time_series,
# sleep_cycles, ...).  The CLI and the *_rows methods work without them.
pandas = [
    "pandas> 1.5, < 3",
    "pyarrow>= 19.0.0",
    "numpy>=2.0.0,<3",
]

[project.scripts]
fulcra = "fulcra_api.cli:cli"
fulcra-api = "fulcra_api.cli:cli"

[dependency-groups]
docs = [
    "mkdocs>=1.5.3,<2",
    "sphinx>=7.2.6,<8",
    "mkdocstrings[python]>=0.29.0,<0.30",
    "mkdocs-material>=9.4.5,<10",
]
test = ["pytest>=9.0.3,<10", "fulcra-api[pandas]"]
dev = ["black>=24.3.0,<27"]

[tool.uv]
default-groups = "all"
exclude-newer = "2 weeks"
# certifi 2026.10.19 removes compromised emSign roots (critical; Dependabot #7); exempt it
# from the cooldown rather than wait two weeks. Drop once it ages past the window.
exclude-newer-package = { certifi = "2026-10-21T00:00:00Z" }
constraint-dependencies = ["certifi>=2026.10.19"]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"
